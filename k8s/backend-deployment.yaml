apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: nikku143/three-tier-backend:latest
          ports:
            - containerPort: 5003
          envFrom:
            - secretRef:
                name: rds-secret
